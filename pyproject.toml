[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookkeeping-cleanup-agent"
version = "1.0.0"
description = "LedgerAI — bookkeeping cleanup agent: Drive ingest, OCR, classify, reconcile, month close, P&L (OpenAI + LlamaParse + Supabase)"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # Domain & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # AI / LLM providers
    "groq>=0.9",
    "openai>=1.35",
    # Document extraction — local (pdfplumber) preferred; llama-parse optional
    "pdfplumber>=0.11",
    "llama-parse>=0.4",
    # Database
    "supabase>=2.5",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    # Report generation
    "openpyxl>=3.1",
    "reportlab>=4.2",
    # Google Drive
    "google-api-python-client>=2.100",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    # Utilities
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "structlog>=24.2",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
# Start the API server
bka-api     = "apps.api.main:app"
# Bulk historical ingestion CLI
bka-ingest  = "apps.cli.ingest:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "apps*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
