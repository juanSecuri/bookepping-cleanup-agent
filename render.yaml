# LedgerAI — single free Web Service (API + responsive SPA)
# Blueprint: https://dashboard.render.com/blueprint/new?repo=https://github.com/juanSecuri/bookepping-cleanup-agent
services:
  - type: web
    name: ledgerai
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: bash bin/render-build.sh
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: EXTRACTION_MODE
        value: local
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_CURRENCY
        value: USD
      - key: FISCAL_YEAR_START_MONTH
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
