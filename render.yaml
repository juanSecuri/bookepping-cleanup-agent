# LedgerAI — Docker Web Service (Tesseract + ffmpeg for OCR/audio)
# Blueprint: https://dashboard.render.com/blueprint/new?repo=https://github.com/juanSecuri/bookepping-cleanup-agent
services:
  - type: web
    name: ledgerai
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: EXTRACTION_MODE
        value: local
      - key: WHISPER_BACKEND
        value: auto
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_CURRENCY
        value: USD
      - key: FISCAL_YEAR_START_MONTH
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
